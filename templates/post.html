<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="site.css">
  $if(highlighting-css)$
  <style>$highlighting-css$</style>
  $endif$
  <title>$title$</title>
</head>
<body>
  <header>
    <div class="site-header-content">
      <a href="index.html">$site-name$</a>
      <details class="font-picker">
        <summary aria-label="Choose font style" title="Choose font style">...</summary>
        <div class="font-picker-menu" role="group" aria-label="Font style">
          <button type="button" data-font-style="default" aria-pressed="true">Default</button>
          <button type="button" data-font-style="serif" aria-pressed="false">Serif</button>
          <button type="button" data-font-style="mono" aria-pressed="false">Mono</button>
        </div>
      </details>
    </div>
  </header>
  <main>
    <article>
      <h1>$title$</h1>
      <p class="post-date">$date$</p>
      $if(tags)$
      <ul class="tags">
        $for(tags)$
        <li>$tags$</li>
        $endfor$
      </ul>
      $endif$
      $body$
    </article>
  </main>
  <footer><a href="index.html">Home</a></footer>
  <script src="font-picker.js"></script>
</body>
</html>

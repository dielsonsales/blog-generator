<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="site.css">
  $if(highlighting-css)$
  <style>$highlighting-css$</style>
  $endif$
  <title>$title$</title>
</head>
<body>
  <header>
    <div class="site-header-content">
      <a href="index.html">$site-name$</a>
      <details class="font-picker">
        <summary aria-label="Choose font style" title="Choose font style">...</summary>
        <div class="font-picker-menu">
          <h2 class="font-picker-title">Font style</h2>
          <div class="font-options" role="group" aria-label="Font style">
            <button type="button" class="font-option" data-font-style="default" aria-pressed="true">
              <span class="font-sample font-sample--default" aria-hidden="true">Ag</span>
              <span>Default</span>
            </button>
            <button type="button" class="font-option" data-font-style="serif" aria-pressed="false">
              <span class="font-sample font-sample--serif" aria-hidden="true">Ag</span>
              <span>Serif</span>
            </button>
            <button type="button" class="font-option" data-font-style="mono" aria-pressed="false">
              <span class="font-sample font-sample--mono" aria-hidden="true">Ag</span>
              <span>Mono</span>
            </button>
          </div>
          <section class="appearance-settings" aria-labelledby="appearance-heading">
            <h3 id="appearance-heading">Appearance</h3>
            <label class="theme-setting" for="theme-toggle">
              <span>Dark theme</span>
              <input id="theme-toggle" type="checkbox" role="switch" data-theme-toggle>
            </label>
          </section>
        </div>
      </details>
    </div>
  </header>
  <main>
    <article>
      <h1>$title$</h1>
      <p class="post-date">$date$</p>
      $if(tags)$
      <ul class="tags">
        $for(tags)$
        <li>$tags$</li>
        $endfor$
      </ul>
      $endif$
      $body$
    </article>
  </main>
  <footer><a href="index.html">Home</a></footer>
  <script src="font-picker.js"></script>
</body>
</html>

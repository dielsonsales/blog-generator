<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="site.css">
  <title>$title$</title>
</head>
<body>
  <header><a href="index.html">Home</a></header>
  <main>
    <article>
      <h1>$title$</h1>
      <p class="post-date">$date$</p>
      $if(tags)$
      <ul class="tags">
        $for(tags)$
        <li>$tags$</li>
        $endfor$
      </ul>
      $endif$
      $body$
    </article>
  </main>
</body>
</html>

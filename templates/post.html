<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="font-picker.js"></script>
  <link rel="stylesheet" href="site.css">
  $if(highlighting-css)$
  <style>$highlighting-css$</style>
  $endif$
  <title>$title$</title>
</head>
<body>
  <header>
    <div class="site-header-content">
      <a href="index.html">$site-name$</a>
      <nav class="site-header-tools" aria-label="Site pages and appearance">
        $about-link$
        $font-picker$
      </nav>
    </div>
  </header>
  <main>
    <article>
      <h1>$title$</h1>
      $if(page-type)$
      $else$
      <p class="post-date">$date$</p>
      $endif$
      $if(tags)$
      <ul class="tags">
        $for(tags)$
        <li>$tags$</li>
        $endfor$
      </ul>
      $endif$
      $body$
    </article>
  </main>
  <footer><a href="index.html">Home</a></footer>
</body>
</html>
